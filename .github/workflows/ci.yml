name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/parameters-iam
          fetch-depth: 0

      - name: Check out parameters-core
        uses: actions/checkout@v4
        with:
          repository: jasonmiller-cc/parameters-core
          path: src/parameters-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: src/parameters-iam/go.sum

      - name: Verify module
        working-directory: src/parameters-iam
        run: go mod verify

      - name: Vet
        working-directory: src/parameters-iam
        run: go vet ./...

      - name: Test
        working-directory: src/parameters-iam
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build
        working-directory: src/parameters-iam
        run: go build -o /dev/null ./cmd/server

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: src/parameters-iam/coverage.out
